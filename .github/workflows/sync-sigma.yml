# 每周从 SigmaHQ 同步规则，构建通过后直接提交到 main 并触发部署（不再等人工审核）。
name: Sync SigmaHQ rules
on:
  schedule: [{ cron: "0 2 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: content-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: git clone --depth 1 https://github.com/SigmaHQ/sigma /tmp/sigma
      - run: node scripts/import-sigma.mjs /tmp/sigma
      - id: diff
        run: echo "changed=$([ -n "$(git status --porcelain src/content)" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed == '1'
        run: npm run build && npm test   # 构建或内容校验失败就不提交
      - if: steps.diff.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/rules
          git commit -m "chore: 同步 SigmaHQ 规则 $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
      - if: steps.diff.outputs.changed == '1'
        run: gh workflow run ci.yml --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
